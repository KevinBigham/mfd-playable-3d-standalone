<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` is load-bearing, not decoration. Without it iOS reports 0 for every
      `env(safe-area-inset-*)`, and this stylesheet has five rules that use those insets to keep
      the pause button and the controls out from under the notch and the home indicator. They
      were all dead on the one device they were written for.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d14" />
    <!--
      Installed to a home screen, the game gets the whole display. In a browser tab it gets the
      display minus Safari's chrome, on the axis a landscape phone has least of. iOS reads these
      two tags and not the manifest, which is why they are here rather than in one.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OVERDRIVE" />
    <title>GRIDIRON OVERDRIVE</title>
    <!--
      The manifest is a data URI, not a file, and that is deliberate: `tools/artifact.ts` folds
      this page into ONE self-contained HTML file with no external references, and a
      `manifest.webmanifest` sitting next to it would be the first thing to break that. Chromium
      parses this form with zero errors and resolves `start_url` and `scope` against the document,
      which a `blob:` manifest does not.
    -->
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22GRIDIRON%20OVERDRIVE%22%2C%22short_name%22%3A%22OVERDRIVE%22%2C%22start_url%22%3A%22.%2F%22%2C%22scope%22%3A%22.%2F%22%2C%22display%22%3A%22fullscreen%22%2C%22orientation%22%3A%22landscape%22%2C%22background_color%22%3A%22%230a0d14%22%2C%22theme_color%22%3A%22%230a0d14%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%20xmlns%3D%2527http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%2527%20viewBox%3D%25270%200%20512%20512%2527%253E%253Crect%20width%3D%2527512%2527%20height%3D%2527512%2527%20fill%3D%2527%25230a0d14%2527%2F%253E%253Cellipse%20cx%3D%2527256%2527%20cy%3D%2527256%2527%20rx%3D%2527176%2527%20ry%3D%2527112%2527%20fill%3D%2527%2523c8622a%2527%2F%253E%253Cpath%20d%3D%2527M144%20256h224%2527%20stroke%3D%2527%2523fff%2527%20stroke-width%3D%252726%2527%2F%253E%253Cpath%20d%3D%2527M200%20214v84M256%20200v112M312%20214v84%2527%20stroke%3D%2527%2523fff%2527%20stroke-width%3D%252718%2527%2F%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22any%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%22%7D%5D%7D" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0d14'/%3E%3Cellipse cx='16' cy='16' rx='11' ry='7' fill='%23c8622a'/%3E%3Cpath d='M9 16h14' stroke='%23fff' stroke-width='1.6'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="ui-root"></div>
      <div id="boot">
        <div class="boot-mark">GRIDIRON<span>OVERDRIVE</span></div>
        <div class="boot-bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
